<!doctype html>
<html lang="nb"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10292c"><meta name="description" content="Kjør ut, kast linen og finn veien hjem. Et fiskespill om stille vann og det som venter under."><title>The Stillwater Below</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%2310292c'/%3E%3Cpath d='M20 6v22a7 7 0 1 1-7-7m7-15 4 4' fill='none' stroke='%23e6c489' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"></head>
<body><main id="game" aria-label="Fiskespillet The Stillwater Below">
<canvas id="landscape" aria-hidden="true"></canvas><canvas id="scene" aria-label="Båten din i et sammenhengende farvann"></canvas><div class="vignette" aria-hidden="true"></div>
<header class="topbar"><div class="brand"><span class="eyebrow">THE</span><h1>STILLWATER <em>BELOW</em></h1></div><div class="place"><span id="location">Stillwater Cove</span><small id="clock">DAG 1 · SKUMRING</small></div><div class="top-actions"><button id="audio" class="icon-button" aria-label="Slå på lyd"></button><button id="settings" class="icon-button" aria-label="Innstillinger"></button></div></header>
<aside class="resources" aria-label="Progresjon"><div class="money"><span>◈</span><strong id="money">20</strong><span>mynt</span></div><div class="composure"><span id="sanity-label">Menneske</span><div class="calm-track"><div id="sanity-bar"></div></div><span id="sanity-number">100</span></div></aside>
<div class="voyage"><span id="dock-distance">← Brygga</span><div class="voyage-track"><i id="voyage-dock"></i><b id="voyage-boat"></b></div><span id="area-name">Stillwater</span></div>
<div id="whisper" class="whisper" aria-live="polite"></div><div id="test-banner" hidden>Spilltest · <button id="end-test">Avslutt testen</button></div>
<div id="fish-tip" class="fish-tip"><p id="hint">Kjør ut og finn din egen fiskeplass.</p><small id="subhint">Hold pilene inne. Brygga ligger bak deg.</small></div>
<div id="fight" class="fight" hidden><div class="fight-heading"><span id="fight-label">LA DEN TREKKE</span><span id="distance">12 m igjen</span></div><div class="tension-track"><div id="tension"></div><div class="tension-line"></div></div><div class="fight-caption"><span>Trygt linetrekk</span><span>Brudd</span></div><div class="progress-caption"><span>FANGST</span><span id="catch-progress-label">0 % inne</span></div><div class="catch-progress"><div id="catch-progress"></div></div></div>
<footer class="controls"><div class="boat-controls"><div class="move-pair"><button id="left" class="square" aria-label="Kjør mot venstre">←</button><button id="anchor" class="square anchor" aria-label="Senk ankeret" aria-pressed="false">⚓</button><button id="right" class="square" aria-label="Kjør mot høyre">→</button></div><button id="pet" class="pet-button">Bris <span>♡</span></button></div>
<div class="fishing-controls"><div class="depth-control"><label for="depth">LINE <strong id="depth-value">12 m</strong></label><input id="depth" type="range" min="4" max="30" value="12" step="1" aria-label="Fiskedybde"><span id="depth-limit">30 m maks</span></div><button id="cast" class="primary"><span id="cast-icon"></span><span id="cast-label">Kast linen</span><kbd>SPACE</kbd></button><button id="cancel" class="cancel" hidden>Trekk inn linen</button></div>
<nav class="book-controls" aria-label="Båtens utstyr"><button id="journal" class="tool-button"><span class="tool-icon" id="journal-icon"></span><span>Loggbok</span><small id="journal-count">0 / 12</small></button><button id="chart" class="tool-button"><span class="tool-icon" id="chart-icon"></span><span>Kart</span><small id="bag-count">0 / 8</small></button><button id="dock" class="tool-button dock-button" hidden><span class="tool-icon" id="dock-icon"></span><span>Legg til</span><small>Old Marsh</small></button></nav></footer>
<div id="toast" role="status" class="toast"></div><div id="loading" class="loading"><span class="eyebrow">STILLWATER COVE</span><p>Båten venter.</p></div>
<dialog id="modal"><button id="close-modal" class="close" aria-label="Lukk">×</button><div id="modal-content"></div></dialog></main><script type="module" src="/main.js"></script></body></html>
