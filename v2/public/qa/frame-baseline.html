<!doctype html><html lang="nb"><meta charset="utf-8"><title>Stillwater — nettleserens rammetakt</title><style>body{background:#102932;color:#e4dcc5;font:18px monospace;padding:30px}pre{white-space:pre-wrap}a{color:#e7cb8a}</style><h1>Kontroll uten spill</h1><p>Kun requestAnimationFrame og denne teksten. Ingen bilder, Canvas, lyd eller spillkode.</p><pre id="reading">Måler …</pre><a href="../?qa">Til spillet</a><script>let last=performance.now(),start=last,frames=[],lastUi=0;function frame(now){frames.push(now-last);last=now;if(frames.length>600)frames.shift();if(now-lastUi>500){const a=[...frames].sort((a,b)=>a-b),mean=a.reduce((n,v)=>n+v,0)/a.length;document.querySelector('#reading').textContent=JSON.stringify({seconds:Math.round((now-start)/1000),frames:a.length,fps:+(1000/mean).toFixed(2),p95:a[Math.floor(a.length*.95)],visible:document.visibilityState,browser:navigator.userAgent},null,2);lastUi=now;}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
